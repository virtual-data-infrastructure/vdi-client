#
# Experimental workflow to verify that EESSI 2026.06 for riscv64 can be
# accessed inside the pre-built EESSI build-node container image via QEMU
# emulation on GitHub Actions. Triggered manually only.

name: RISC-V Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-eessi-riscv64:
    name: Test EESSI 2026.06 on riscv64
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/eessi/build-node:debian13-riscv64
      options: --privileged

    steps:
      - name: Show architecture
        run: |
          uname -m
          cat /etc/os-release | head -5

      - name: Mount EESSI CernVM-FS repository
        run: |
          mkdir -p /cvmfs/software.eessi.io
          cvmfs2 software.eessi.io /cvmfs/software.eessi.io

      - name: Initialize EESSI 2026.06
        run: |
          source /cvmfs/software.eessi.io/versions/2026.06/init/bash
          echo "EESSI_EPREFIX=${EESSI_EPREFIX}"
          module load EESSI/2026.06
          module list

      - name: Sanity check compiler
        run: |
          source /cvmfs/software.eessi.io/versions/2026.06/init/bash
          module load EESSI/2026.06
          gcc --version
          echo "EESSI_EPREFIX=${EESSI_EPREFIX}"
          ls "${EESSI_EPREFIX}/usr/bin/"
