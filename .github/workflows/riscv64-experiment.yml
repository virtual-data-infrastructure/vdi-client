#
# Experimental workflow to verify that EESSI 2026.06 for riscv64 can be
# accessed inside the pre-built EESSI build-node container image via QEMU
# emulation on GitHub Actions. Triggered manually only.

name: RISC-V Experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-eessi-riscv64:
    name: Test EESSI 2026.06 on riscv64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64

      - name: Show host architecture
        run: uname -m

      - name: Test EESSI 2026.06 inside riscv64 container
        run: |
          docker run --rm \
            --platform linux/riscv64 \
            --privileged \
            --device /dev/fuse \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/eessi/build-node:debian13-riscv64 \
            bash -c '
              set -e
              echo "=== Architecture ==="
              uname -m
              cat /etc/os-release | head -5

              echo "=== Initialize CernVM-FS ==="
              mkdir -p /var/run/cvmfs /var/lib/cvmfs
              cvmfs_config setup

              echo "=== Mount CernVM-FS ==="
              mount -t cvmfs software.eessi.io /cvmfs/software.eessi.io

              echo "=== Verify mount ==="
              ls /cvmfs/software.eessi.io/versions/

              echo "=== Initialize EESSI 2026.06 ==="
              export EESSI_INIT_RISCV_SUPPRESS_SUPPORT_WARNING=1
              source /cvmfs/software.eessi.io/versions/2026.06/init/lmod/bash
              echo "EESSI_EPREFIX=${EESSI_EPREFIX}"
              # module load EESSI/2026.06
              module list

              echo "=== Sanity check compiler ==="
              gcc --version
              ls "${EESSI_EPREFIX}/usr/bin/"
            '
