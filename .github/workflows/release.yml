# SPDX-License-Identifier: GPL-2.0-only
# Copyright (C) 2025-2026 VDI contributors
#
# VDI client - client tools for the virtual data infrastructure.
#
# GitHub Actions workflow for building per-architecture fat wheels and
# publishing them to PyPI. Triggered by tag pushes matching 'v*'.
#
# Each architecture produces a single fat wheel containing libvdi_eessi*.so
# for every supported EESSI version (2023.06, 2025.06, 2026.06); riscv64
# builds only against EESSI 2026.06 via QEMU emulation. At runtime
# the CLI detects the active EESSI version from EESSI_EPREFIX and selects
# the matching shared library.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC trusted publishing requires write access for the id-token.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build fat wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Mount EESSI CernVM-FS repository
        uses: eessi/github-action-eessi@834df09f7d60de47f10a7cbf59b470d69b9e2852 # v3.4.0
        with:
          eessi_stack_version: '2023.06'

      - name: Build versioned libraries for all EESSI versions
        run: |
          set -euo pipefail

          # The EESSI github action initializes the first version and sets
          # EESSI_EPREFIX. We build the first version, then switch to the
          # remaining versions via 'module load EESSI/<version>'.
          build_one() {
            local version="$1"
            echo "=== Building libvdi_eessi${version}.so ==="

            # Create a fresh venv using the EESSI compat-layer Python
            local eessi_python="${EESSI_EPREFIX}/usr/bin/python"
            rm -rf .build-venv
            "$eessi_python" -m venv .build-venv
            source .build-venv/bin/activate
            pip install --quiet --upgrade pip
            pip install --quiet build

            # Build and install the versioned library
            make install-library-versioned EESSI_VERSION="${version}"

            deactivate
          }

          # First version is already initialized by the EESSI action
          build_one "2023.06"

          # Switch to 2025.06
          module load EESSI/2025.06
          build_one "2025.06"

          # Switch to 2026.06
          module load EESSI/2026.06
          build_one "2026.06"

          # Build the fat wheel (does not require EESSI, just Python)
          # Use the last active EESSI Python for the venv
          source .build-venv/bin/activate
          make build-wheel
          deactivate

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: Test fat wheel (${{ matrix.arch }}, EESSI ${{ matrix.eessi_version }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2023.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2025.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2026.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2023.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2025.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2026.06'

    steps:
      - name: Mount EESSI CernVM-FS repository
        uses: eessi/github-action-eessi@834df09f7d60de47f10a7cbf59b470d69b9e2852 # v3.4.0
        with:
          eessi_stack_version: '${{ matrix.eessi_version }}'

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.arch }}
          path: wheel

      - name: Install wheel into venv using EESSI compat-layer Python
        run: |
          # Use the EESSI compat-layer Python to avoid glibc mismatches
          # between the GitHub toolcache Python and EESSI's compat layer.
          EESSI_PYTHON="${EESSI_EPREFIX}/usr/bin/python"
          "$EESSI_PYTHON" -m venv /tmp/test-vdi
          /tmp/test-vdi/bin/pip install --upgrade pip
          /tmp/test-vdi/bin/pip install wheel/*.whl

      - name: Test CLI basics
        run: |
          /tmp/test-vdi/bin/vdi --version
          /tmp/test-vdi/bin/vdi --help
          /tmp/test-vdi/bin/vdi run --dry-run cat /etc/hostname

      - name: Test run with LD_PRELOAD and log creation
        env:
          VDI_LOG_DIR: /tmp/vdi-test-logs
        run: |
          mkdir -p /tmp/vdi-test-logs
          /tmp/test-vdi/bin/vdi run cat /etc/hostname
          # Verify a log file was created
          log_count=$(find /tmp/vdi-test-logs -name '*.log' | wc -l)
          if [ "$log_count" -eq 0 ]; then
            echo "Error: no log file was created"
            exit 1
          fi
          echo "Log file(s) created: $log_count"

      - name: Test log subcommands
        env:
          VDI_LOG_DIR: /tmp/vdi-test-logs
        run: |
          /tmp/test-vdi/bin/vdi log list
          /tmp/test-vdi/bin/vdi log list --long
          # Get the PID from the first log file and show its contents
          pid=$(find /tmp/vdi-test-logs -name 'vdi_log.*.log' -exec basename {} .log \; | head -1 | sed 's/vdi_log\.//')
          echo "Showing log for PID: $pid"
          /tmp/test-vdi/bin/vdi log show "$pid"

  build-riscv64:
    name: Build fat wheel (riscv64)
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64

      - name: Build versioned library and wheel inside riscv64 container
        run: |
          docker run --rm \
            --platform linux/riscv64 \
            --privileged \
            --device /dev/fuse \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/eessi/build-node:debian13-riscv64 \
            bash -c '
              set -euo pipefail
              export EESSI_INIT_RISCV_SUPPRESS_SUPPORT_WARNING=1

              # Initialize CernVM-FS
              mkdir -p /var/run/cvmfs /var/lib/cvmfs
              cvmfs_config setup
              mount -t cvmfs software.eessi.io /cvmfs/software.eessi.io

              # Initialize EESSI 2026.06 (only version supporting riscv64)
              source /cvmfs/software.eessi.io/versions/2026.06/init/lmod/bash

              # Build the versioned library
              make install-library-versioned EESSI_VERSION="2026.06"

              # Build the fat wheel using EESSI compat-layer Python
              eessi_python="${EESSI_EPREFIX}/usr/bin/python"
              rm -rf .build-venv
              "$eessi_python" -m venv .build-venv
              source .build-venv/bin/activate
              pip install --quiet --upgrade pip
              pip install --quiet build
              make build-wheel
              deactivate
            '

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-riscv64
          path: dist/*.whl
          if-no-files-found: error

  test-riscv64:
    name: Test fat wheel (riscv64, EESSI 2026.06)
    needs: build-riscv64
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-riscv64
          path: wheel

      - name: Test wheel inside riscv64 container
        run: |
          docker run --rm \
            --platform linux/riscv64 \
            --privileged \
            --device /dev/fuse \
            -v "$PWD:/workspace" \
            -w /workspace \
            ghcr.io/eessi/build-node:debian13-riscv64 \
            bash -c '
              set -euo pipefail
              export EESSI_INIT_RISCV_SUPPRESS_SUPPORT_WARNING=1

              # Initialize CernVM-FS
              mkdir -p /var/run/cvmfs /var/lib/cvmfs
              cvmfs_config setup
              mount -t cvmfs software.eessi.io /cvmfs/software.eessi.io

              # Initialize EESSI 2026.06
              source /cvmfs/software.eessi.io/versions/2026.06/init/lmod/bash
              module load EESSI/2026.06

              # Install wheel into venv using EESSI compat-layer Python
              eessi_python="${EESSI_EPREFIX}/usr/bin/python"
              "$eessi_python" -m venv /tmp/test-vdi
              /tmp/test-vdi/bin/pip install --upgrade pip
              /tmp/test-vdi/bin/pip install wheel/*.whl

              # Test CLI basics
              /tmp/test-vdi/bin/vdi --version
              /tmp/test-vdi/bin/vdi --help
              /tmp/test-vdi/bin/vdi run --dry-run cat /etc/hostname

              # Test run with LD_PRELOAD and log creation
              mkdir -p /tmp/vdi-test-logs
              export VDI_LOG_DIR=/tmp/vdi-test-logs
              /tmp/test-vdi/bin/vdi run cat /etc/hostname
              log_count=$(find /tmp/vdi-test-logs -name "*.log" | wc -l)
              if [ "$log_count" -eq 0 ]; then
                echo "Error: no log file was created"
                exit 1
              fi
              echo "Log file(s) created: $log_count"

              # Test log subcommands
              /tmp/test-vdi/bin/vdi log list
              /tmp/test-vdi/bin/vdi log list --long
              pid=$(find /tmp/vdi-test-logs -name "vdi_log.*.log" -exec basename {} .log \; | head -1 | sed "s/vdi_log\.//")
              echo "Showing log for PID: $pid"
              /tmp/test-vdi/bin/vdi log show "$pid"
            '

  publish:
    name: Publish to PyPI
    needs: [build, test, build-riscv64, test-riscv64]
    runs-on: ubuntu-24.04
    environment: pypi

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist

  release:
    name: Create GitHub Release
    needs: [build, test, build-riscv64, test-riscv64, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          python .github/scripts/extract_changelog.py ${{ steps.get_version.outputs.VERSION }} > /tmp/changelog.txt
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.whl
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
