#
# VDI client - client tools for the virtual data infrastructure.
#
# GitHub Actions workflow for building per-architecture platform wheels
# and publishing them to PyPI. Triggered by tag pushes matching 'v*'.
#
# The workflow compiles libvdi.so against the EESSI toolchain, bundles it
# into a platform wheel via 'make build-wheel', and publishes the result
# to PyPI using OIDC trusted publishing (no API token required).
#
# Each {architecture, EESSI_version} combination produces a distinct wheel
# with the EESSI version encoded as a local version segment (e.g.
# vdi_client-0.1.0+eessi2023.06-...whl).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# OIDC trusted publishing requires write access for the id-token.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build wheel (${{ matrix.arch }}, EESSI ${{ matrix.eessi_version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2023.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2025.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2026.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2023.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2025.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2026.06'

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Mount EESSI CernVM-FS repository
        uses: eessi/github-action-eessi@834df09f7d60de47f10a7cbf59b470d69b9e2852 # v3.4.0
        with:
          eessi_stack_version: '${{ matrix.eessi_version }}'

      - name: Build wheel
        run: make build-wheel EESSI_VERSION=${{ matrix.eessi_version }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.arch }}-eessi-${{ matrix.eessi_version }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: Test wheel (${{ matrix.arch }}, EESSI ${{ matrix.eessi_version }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2023.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2025.06'
          - arch: x86_64
            runner: ubuntu-24.04
            eessi_version: '2026.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2023.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2025.06'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            eessi_version: '2026.06'

    steps:
      - name: Mount EESSI CernVM-FS repository
        uses: eessi/github-action-eessi@834df09f7d60de47f10a7cbf59b470d69b9e2852 # v3.4.0
        with:
          eessi_stack_version: '${{ matrix.eessi_version }}'

      - name: Download wheel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.arch }}-eessi-${{ matrix.eessi_version }}
          path: wheel

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.11'

      - name: Install wheel and create venv
        run: |
          python -m venv /tmp/test-vdi
          /tmp/test-vdi/bin/pip install --upgrade pip
          /tmp/test-vdi/bin/pip install wheel/*.whl

      - name: Test CLI basics
        run: |
          /tmp/test-vdi/bin/vdi --version
          /tmp/test-vdi/bin/vdi --help
          /tmp/test-vdi/bin/vdi run --dry-run cat /etc/hostname

      - name: Test run with LD_PRELOAD and log creation
        env:
          VDI_LOG_DIR: /tmp/vdi-test-logs
        run: |
          mkdir -p /tmp/vdi-test-logs
          /tmp/test-vdi/bin/vdi run cat /etc/hostname
          # Verify a log file was created
          log_count=$(find /tmp/vdi-test-logs -name '*.log' | wc -l)
          if [ "$log_count" -eq 0 ]; then
            echo "Error: no log file was created"
            exit 1
          fi
          echo "Log file(s) created: $log_count"

      - name: Test log subcommands
        env:
          VDI_LOG_DIR: /tmp/vdi-test-logs
        run: |
          /tmp/test-vdi/bin/vdi log list
          /tmp/test-vdi/bin/vdi log list --long
          # Get the PID from the first log file and show its contents
          pid=$(find /tmp/vdi-test-logs -name 'vdi_log.*.log' -exec basename {} .log \; | head -1 | sed 's/vdi_log\.//')
          echo "Showing log for PID: $pid"
          /tmp/test-vdi/bin/vdi log show "$pid"

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-24.04
    environment: pypi

    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
