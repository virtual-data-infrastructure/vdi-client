# Portability regression tests for the libvdi.so wrapper.

name: libvdi wrapper portability tests

on:
  push:
    branches:
      - main
    paths:
      - 'src/vdi_wrapper/vdi.c'
      - '.github/scripts/test-libvdi-wrapper-portability.sh'
      - '.github/workflows/tests-libvdi-wrapper-portability.yml'
  pull_request:
    paths:
      - 'src/vdi_wrapper/vdi.c'
      - '.github/scripts/test-libvdi-wrapper-portability.sh'
      - '.github/workflows/tests-libvdi-wrapper-portability.yml'
  workflow_dispatch:

permissions: read-all

jobs:
  wrapper-portability:
    name: Portability tests (macOS)
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run libvdi wrapper portability tests
        run: .github/scripts/test-libvdi-wrapper-portability.sh
